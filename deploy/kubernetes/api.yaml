apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-api
  namespace: sentinel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-api-config
  namespace: sentinel
data:
  AUTH_REQUIRED: "true"
  SEED_DEMO_DATA: "false"
  CORS_ORIGINS: "https://sentinel.example.gov"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-api }
  template:
    metadata:
      labels: { app: sentinel-api }
    spec:
      serviceAccountName: sentinel-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: registry.example.gov/sentinel/api:1.1.0
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: sentinel-api-config }
            - secretRef: { name: sentinel-api-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: sentinel
spec:
  selector: { app: sentinel-api }
  ports: [{ port: 8000, targetPort: 8000 }]
