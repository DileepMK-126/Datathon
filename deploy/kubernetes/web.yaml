apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-web
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: sentinel-web }
  template:
    metadata:
      labels: { app: sentinel-web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: registry.example.gov/sentinel/web:1.1.0
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-web
  namespace: sentinel
spec:
  selector: { app: sentinel-web }
  ports: [{ port: 80, targetPort: 8080 }]
